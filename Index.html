<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-card">
    <h2>Grade Calculator</h2>
    <p class="subtitle">Enter your course grades and weights to calculate your final percentage.</p>

    <div id="course-rows">
      
      <div class="row">
        <input type="text" placeholder="Assignment / Exam" class="assignment-name">
        <input type="number" placeholder="Grade (%)" class="grade-input" min="0" max="100">
        <input type="number" placeholder="Weight (%)" class="weight-input" min="0" max="100">
        <button class="remove-btn" onclick="removeRow(this)">✕</button>
      </div>
      <div class="row">
        <input type="text" placeholder="Assignment / Exam" class="assignment-name">
        <input type="number" placeholder="Grade (%)" class="grade-input" min="0" max="100">
        <input type="number" placeholder="Weight (%)" class="weight-input" min="0" max="100">
        <button class="remove-btn" onclick="removeRow(this)">✕</button>
      </div>
    </div>

    <div class="actions">
      <button id="add-btn" class="secondary-btn">+ Add Item</button>
      <button id="calc-btn" class="primary-btn">Calculate Grade</button>
    </div>

    <div id="result-box" class="result-box hidden">
      <h3>Overall Grade: <span id="final-percentage">0%</span></h3>
      <p>Letter Grade: <strong id="letter-grade">-</strong></p>
      <p id="weight-warning" class="warning"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
                         </html>
